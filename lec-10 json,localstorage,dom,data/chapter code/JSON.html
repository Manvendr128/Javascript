<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON</title>
</head>
<body>
  <script>
    let product = {
      name : 'tshirt',
      price : 789,
      rating : {
        stars : 4.5,
        noofreview : 458,
      },
    }
    console.log(typeof(product));
    console.log(product);
    let str = JSON.stringify(product); // convert the object into string
    console.log(typeof(str));
    console.log(str);

    let newproduct = JSON.parse(str);
     console.log(typeof(newproduct));
     console.log(newproduct);
  </script>
</body>
</html>
